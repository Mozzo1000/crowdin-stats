{{define "embed-builder"}}
  <div class="embed-builder panel p-5">
    <div class="flex gap-2 mb-5">
      <button type="button" data-embed-type="table" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Translation progress</button>
      <button type="button" data-embed-type="overall" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Overall</button>
      <button type="button" data-embed-type="contributors" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Contributors</button>
    </div>

    <div data-builder-table-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label class="block text-sm font-medium mb-1.5">Progress</label>
        <select data-builder-table-progress class="field-mono w-full">
          <option value="translation">translation</option>
          <option value="approval">approval</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Top N languages <span class="text-text-muted font-normal">(0 = all)</span></label>
        <input type="number" min="0" max="200" value="0" data-builder-table-limit class="field-mono w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Minimum % <span class="text-text-muted font-normal">(0 = no filter)</span></label>
        <input type="number" min="0" max="100" value="0" data-builder-table-minpercent class="field-mono w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Only show languages <span class="text-text-muted font-normal">(comma-separated codes or names, e.g. "fr,de" — overrides Top N/Minimum % above)</span></label>
        <input type="text" placeholder="fr,de" data-builder-table-languages class="field-mono w-full" />
      </div>
    </div>

    <div data-builder-contrib-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label class="flex items-center justify-between text-sm font-medium mb-1.5">
          <span>Limit</span>
          <span data-builder-limit-value class="text-text-muted font-mono">30</span>
        </label>
        <input type="range" min="1" max="100" value="30" data-builder-limit class="w-full accent-accent" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Unit</label>
        <select data-builder-unit class="field-mono w-full">
          <option value="words">words</option>
          <option value="strings">strings</option>
          <option value="characters">characters</option>
        </select>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" data-builder-hideowner class="rounded border-border accent-accent" />
        Hide project owner
      </label>
    </div>

    <div data-builder-overall-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label class="block text-sm font-medium mb-1.5">Variant</label>
        <select data-builder-overall-variant class="field-mono w-full">
          <option value="card">card</option>
          <option value="circle">circle</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Progress</label>
        <select data-builder-overall-progress class="field-mono w-full">
          <option value="translation">translation</option>
          <option value="approval">approval</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Unit</label>
        <select data-builder-overall-unit class="field-mono w-full">
          <option value="words">words</option>
          <option value="strings">strings</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Metric <span class="text-text-muted font-normal">(card only)</span></label>
        <select data-builder-overall-metric class="field-mono w-full">
          <option value="both">both</option>
          <option value="percentage">percentage</option>
          <option value="fraction">fraction</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1.5">Default colors</label>
      <div class="flex gap-2">
        <button type="button" data-builder-theme="light" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Light</button>
        <button type="button" data-builder-theme="dark" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Dark</button>
      </div>
    </div>

    <div class="grid grid-cols-5 gap-2 mb-5 pb-5 border-b border-border">
      <label class="flex flex-col items-center gap-1.5 text-xs text-text-muted">
        bg
        <input type="color" data-builder-color="bg" class="w-9 h-9 rounded cursor-pointer border border-border" />
      </label>
      <label class="flex flex-col items-center gap-1.5 text-xs text-text-muted">
        text
        <input type="color" data-builder-color="text" class="w-9 h-9 rounded cursor-pointer border border-border" />
      </label>
      <label class="flex flex-col items-center gap-1.5 text-xs text-text-muted">
        muted
        <input type="color" data-builder-color="muted" class="w-9 h-9 rounded cursor-pointer border border-border" />
      </label>
      <label class="flex flex-col items-center gap-1.5 text-xs text-text-muted">
        accent
        <input type="color" data-builder-color="accent" class="w-9 h-9 rounded cursor-pointer border border-border" />
      </label>
      <label class="flex flex-col items-center gap-1.5 text-xs text-text-muted">
        border
        <input type="color" data-builder-color="border" class="w-9 h-9 rounded cursor-pointer border border-border" />
      </label>
    </div>

    <div class="mb-4 overflow-x-auto">
      <img data-builder-preview-img class="max-w-full" alt="{{if .LivePreview}}Live image preview with your chosen settings{{else}}Preview of your chosen settings{{end}}" />
      {{if not .LivePreview}}
        <div data-builder-preview></div>
      {{end}}
    </div>

    <div class="flex items-center gap-2">
      <div data-builder-url class="flex-1 font-mono text-xs text-accent break-all bg-bg-subtle border border-border rounded-lg px-3 py-2"></div>
      <button type="button" data-builder-copy class="btn-secondary text-xs px-3 py-2 shrink-0">Copy URL</button>
    </div>
    {{if not .LivePreview}}
      <p class="mt-2 text-xs text-text-muted">
        <span class="builder-placeholder">{public_id}</span> is a stand-in — <a href="/setup" class="text-accent hover:underline">set up your project</a> to get a URL that actually works.
      </p>
    {{end}}
  </div>
{{end}}
