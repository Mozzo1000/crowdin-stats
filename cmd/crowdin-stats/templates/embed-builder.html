{{define "embed-builder"}}
  <div class="embed-builder panel p-5">
    <div class="flex gap-2 mb-5">
      <button type="button" data-embed-type="table" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Translation progress</button>
      <button type="button" data-embed-type="overall" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Overall</button>
      <button type="button" data-embed-type="contributors" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Contributors</button>
    </div>

    <div data-builder-table-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label for="builder-table-progress" class="block text-sm font-medium mb-1.5">Progress</label>
        <select id="builder-table-progress" data-builder-table-progress class="field-mono w-full">
          <option value="translation">translation</option>
          <option value="approval">approval</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Top N languages <span class="text-text-muted font-normal">(0 = all)</span></label>
        <input type="number" min="0" max="200" value="0" data-builder-table-limit class="field-mono w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Minimum % <span class="text-text-muted font-normal">(0 = no filter)</span></label>
        <input type="number" min="0" max="100" value="0" data-builder-table-minpercent class="field-mono w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Only show languages <span class="text-text-muted font-normal">(comma-separated codes or names, e.g. "fr,de" — overrides Top N/Minimum % above)</span></label>
        <input type="text" placeholder="fr,de" data-builder-table-languages class="field-mono w-full" />
      </div>
    </div>

    <div data-builder-contrib-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label for="builder-limit" class="flex items-center justify-between text-sm font-medium mb-1.5">
          <span>Limit</span>
          <span data-builder-limit-value aria-live="polite" class="text-text-muted font-mono">30</span>
        </label>
        <input id="builder-limit" type="range" min="1" max="100" value="30" data-builder-limit class="w-full accent-accent" />
      </div>
      <div>
        <label for="builder-avatarsize" class="flex items-center justify-between text-sm font-medium mb-1.5">
          <span>Avatar size</span>
          <span data-builder-avatarsize-value aria-live="polite" class="text-text-muted font-mono">64</span>
        </label>
        <input id="builder-avatarsize" type="range" min="24" max="128" value="64" data-builder-avatarsize class="w-full accent-accent" />
      </div>
      <div>
        <label for="builder-unit" class="block text-sm font-medium mb-1.5">Unit</label>
        <select id="builder-unit" data-builder-unit class="field-mono w-full">
          <option value="words">words</option>
          <option value="strings">strings</option>
          <option value="characters">characters</option>
        </select>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" data-builder-hideowner class="rounded border-border accent-accent" />
        Hide project owner
      </label>
    </div>

    <div data-builder-overall-controls class="hidden space-y-4 mb-5 pb-5 border-b border-border">
      <div>
        <label for="builder-overall-variant" class="block text-sm font-medium mb-1.5">Variant</label>
        <select id="builder-overall-variant" data-builder-overall-variant class="field-mono w-full">
          <option value="card">card</option>
          <option value="circle">circle</option>
        </select>
      </div>
      <div>
        <label for="builder-overall-progress" class="block text-sm font-medium mb-1.5">Progress</label>
        <select id="builder-overall-progress" data-builder-overall-progress class="field-mono w-full">
          <option value="translation">translation</option>
          <option value="approval">approval</option>
        </select>
      </div>
      <div>
        <label for="builder-overall-unit" class="block text-sm font-medium mb-1.5">Unit</label>
        <select id="builder-overall-unit" data-builder-overall-unit class="field-mono w-full">
          <option value="words">words</option>
          <option value="strings">strings</option>
        </select>
      </div>
      <div>
        <label for="builder-overall-metric" class="block text-sm font-medium mb-1.5">Metric <span class="text-text-muted font-normal">(card only)</span></label>
        <select id="builder-overall-metric" data-builder-overall-metric class="field-mono w-full">
          <option value="both">both</option>
          <option value="percentage">percentage</option>
          <option value="fraction">fraction</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1.5">Default colors</label>
      <div class="flex gap-2">
        <button type="button" data-builder-theme="light" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Light</button>
        <button type="button" data-builder-theme="dark" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium border border-border transition-colors">Dark</button>
      </div>
    </div>

    <div class="grid grid-cols-[repeat(auto-fit,minmax(130px,1fr))] gap-3 mb-5 pb-5 border-b border-border">
      <div data-builder-color-row="bg" class="flex flex-col gap-1">
        <label class="text-xs text-text-muted">Background</label>
        <div class="color-swatch-field">
          <input type="color" data-builder-color="bg" />
          <input type="text" data-builder-color-hex="bg" maxlength="7" spellcheck="false" />
        </div>
        <label class="inline-flex items-center gap-1.5 text-xs text-text-muted w-max">
          <input type="checkbox" data-builder-transparent="bg" />
          Transparent
        </label>
      </div>
      <div data-builder-color-row="text" class="flex flex-col gap-1">
        <label class="text-xs text-text-muted">Text</label>
        <div class="color-swatch-field">
          <input type="color" data-builder-color="text" />
          <input type="text" data-builder-color-hex="text" maxlength="7" spellcheck="false" />
        </div>
        <div class="relative inline-flex items-center gap-1 group w-max">
          <span data-builder-contrast="text" class="text-xs whitespace-nowrap"></span>
          <button type="button" class="text-text-muted hover:text-text focus:outline-none focus:text-text" aria-describedby="contrast-tip-text" aria-label="What does this contrast rating mean?">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </button>
          <span id="contrast-tip-text" role="tooltip" data-builder-contrast-tip="text" class="tooltip-bubble"></span>
        </div>
      </div>
      <div data-builder-color-row="muted" class="flex flex-col gap-1">
        <label class="text-xs text-text-muted">Muted text</label>
        <div class="color-swatch-field">
          <input type="color" data-builder-color="muted" />
          <input type="text" data-builder-color-hex="muted" maxlength="7" spellcheck="false" />
        </div>
        <div class="relative inline-flex items-center gap-1 group w-max">
          <span data-builder-contrast="muted" class="text-xs whitespace-nowrap"></span>
          <button type="button" class="text-text-muted hover:text-text focus:outline-none focus:text-text" aria-describedby="contrast-tip-muted" aria-label="What does this contrast rating mean?">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </button>
          <span id="contrast-tip-muted" role="tooltip" data-builder-contrast-tip="muted" class="tooltip-bubble"></span>
        </div>
      </div>
      <div data-builder-color-row="accent" class="flex flex-col gap-1">
        <label class="text-xs text-text-muted">Accent</label>
        <div class="color-swatch-field">
          <input type="color" data-builder-color="accent" />
          <input type="text" data-builder-color-hex="accent" maxlength="7" spellcheck="false" />
        </div>
        <div class="relative inline-flex items-center gap-1 group w-max">
          <span data-builder-contrast="accent" class="text-xs whitespace-nowrap"></span>
          <button type="button" class="text-text-muted hover:text-text focus:outline-none focus:text-text" aria-describedby="contrast-tip-accent" aria-label="What does this contrast rating mean?">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          </button>
          <span id="contrast-tip-accent" role="tooltip" data-builder-contrast-tip="accent" class="tooltip-bubble"></span>
        </div>
      </div>
      <div data-builder-color-row="border" class="flex flex-col gap-1">
        <label class="text-xs text-text-muted">Border</label>
        <div class="color-swatch-field">
          <input type="color" data-builder-color="border" />
          <input type="text" data-builder-color-hex="border" maxlength="7" spellcheck="false" />
        </div>
        <label class="inline-flex items-center gap-1.5 text-xs text-text-muted w-max">
          <input type="checkbox" data-builder-transparent="border" />
          Transparent
        </label>
      </div>
    </div>

    <div class="mb-4 overflow-x-auto">
      <img data-builder-preview-img class="max-w-full" alt="{{if .LivePreview}}Live image preview with your chosen settings{{else}}Preview of your chosen settings{{end}}" />
      <div data-builder-preview aria-hidden="true" inert></div>
    </div>

    {{if .LivePreview}}
      <div class="flex gap-2 mb-2">
        <button type="button" data-builder-format="markdown" class="flex-1 rounded-lg px-2.5 py-1.5 text-xs font-medium border border-border transition-colors">Markdown</button>
        <button type="button" data-builder-format="html" class="flex-1 rounded-lg px-2.5 py-1.5 text-xs font-medium border border-border transition-colors">HTML</button>
        <button type="button" data-builder-format="rst" class="flex-1 rounded-lg px-2.5 py-1.5 text-xs font-medium border border-border transition-colors">reStructuredText</button>
        <button type="button" data-builder-format="url" class="flex-1 rounded-lg px-2.5 py-1.5 text-xs font-medium border border-border transition-colors">URL only</button>
      </div>
      <label data-builder-link-row class="hidden items-center gap-2 text-xs text-text-muted mb-2">
        <input type="checkbox" data-builder-link-toggle class="rounded border-border accent-accent" />
        Link image to the Crowdin project page
      </label>
    {{end}}

    <div class="flex items-center gap-2">
      <div data-builder-url class="flex-1 font-mono text-xs text-accent break-all bg-bg-subtle border border-border rounded-lg px-3 py-2"></div>
      <button type="button" data-builder-copy aria-live="polite" class="btn-secondary text-xs px-3 py-2 shrink-0">Copy URL</button>
    </div>
    {{if not .LivePreview}}
      <p class="mt-2 text-xs text-text-muted">
        <span class="builder-placeholder">{public_id}</span> is a stand-in — <a href="/setup" class="text-accent hover:underline">set up your project</a> to get a URL that actually works.
      </p>
    {{end}}
  </div>
{{end}}
